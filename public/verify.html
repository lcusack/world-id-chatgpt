<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9f9f8" />
    <link rel="preload" href="/WorldProMVPVF.ttf" as="font" type="font/ttf" crossorigin />
    <title>Verify with World ID</title>
    <style>
      @font-face { font-family: "World Pro"; src: url("/WorldProMVPVF.ttf") format("truetype"); font-style: normal; font-weight: 100 900; font-display: swap; }
      :root { color-scheme: light; font-family: "World Pro", "Noto Sans", Helvetica, sans-serif; font-weight: 325; }
      * { box-sizing: border-box; }
      strong { font-weight: 500; }
      [hidden] { display: none !important; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f9f9f8; color: #181818; padding: 24px; }
      main { width: min(100%, 430px); background: #fff; border: 1px solid #e1dfda; border-radius: 24px; padding: 36px; box-shadow: 0 20px 60px rgba(24, 24, 24, .06); text-align: center; }
      .world-logo { display: block; width: 96px; height: 24px; margin: 0 auto 34px; }
      .context { margin: 0 0 18px; color: #75726f; font-size: 14px; font-weight: 500; }
      h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.08; letter-spacing: -.02em; font-weight: 325; }
      p { margin: 0 auto 26px; color: #75726f; line-height: 1.5; }
      button, a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; background: #181818; color: #fff; text-decoration: none; font: inherit; font-weight: 500; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #world-link { margin-top: 8px; background: #3fdbed; color: #181818; }
      #qr { display: block; margin: 24px auto 0; border: 12px solid #fff; border-radius: 16px; box-shadow: 0 0 0 1px #e1dfda; }
      .privacy { margin: 28px 0 0; padding-top: 22px; border-top: 1px solid #e1dfda; font-size: 12px; line-height: 1.5; color: #9d9b96; }
      body[data-state="verified"] .context { color: #00ab48; }
      body[data-state="error"] .context { color: #ea392a; }
    </style>
  </head>
  <body data-state="ready">
    <main>
      <img class="world-logo" src="/world-logo.svg" alt="World" width="96" height="24" />
      <div class="context">World ID · Proof of Human</div>
      <h1 id="status">Verify your World ID</h1>
      <p id="detail">Connect an Orb-verified Proof of Human to <strong id="client-name">your AI assistant</strong> without sharing your identity.</p>
      <button id="verify-button" type="button">Verify with World ID</button>
      <div><a id="world-link" class="button" href="#" hidden>Open World App</a></div>
      <canvas id="qr" hidden aria-label="World ID verification QR code"></canvas>
      <div class="privacy">Your AI assistant receives only the verification result—not your proof, session ID, nullifier, wallet, phone number, or World ID.</div>
    </main>
    <script type="module" src="/verify.js"></script>
  </body>
</html>
